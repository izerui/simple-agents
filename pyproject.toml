[project]
name = "simple-agents"
version = "0.2.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "load-dotenv>=0.1.0",
    "markdownify>=1.2.2",
    "requests>=2.32.5",
    "rich>=14.3.3",
    # Deepagents dependencies
    "langchain-core>=1.2.10,<2.0.0",
    "langchain>=1.2.10,<2.0.0",
    "langchain-anthropic>=1.3.3,<2.0.0",
    "langchain-google-genai>=4.2.1,<5.0.0",
    "wcmatch",
    # langgraph dependencies
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.1.10",
    "langgraph-api>=0.7.60",
    "langgraph-cli>=0.4.12",
    "langgraph>=1.0.9",
    "fastapi>=0.132.0",
    # skills dependencies
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "xlsxwriter>=3.2.9",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "debugpy>=1.8.19",
    "locust>=2.37.14",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "deepagents*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
