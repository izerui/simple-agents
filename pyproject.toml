[project]
name = "simple-agents"
version = "0.2.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.1.6",
    "langgraph-cli[all]>=0.4.11",
    "load-dotenv>=0.1.0",
    "markdownify>=1.2.2",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "sse-starlette>=2.1.0,<2.2.0",
    # Deepagents dependencies
    "langchain-anthropic>=1.2.0,<2.0.0",
    "langchain-google-genai",
    "langchain>=1.1.0,<2.0.0",
    "langchain-core>=1.1.0,<2.0.0",
    "wcmatch",
    "pdfplumber>=0.11.8",
    "pymupdf>=1.26.7",
    "langgraph-api>=0.6.16",
    "mammoth>=1.11.0",
    "html2text>=2025.4.15",
    "fastapi>=0.128.0",
    "pypandoc-binary>=1.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "debugpy>=1.8.19"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "deepagents*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
