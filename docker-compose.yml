services:
    redis:
        image: serv999.com/hub/redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5

    postgres:
        image: serv999.com/hub/pgvector/pgvector:pg16
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        command:
            - postgres
            - -c
            - shared_preload_libraries=vector
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s

    agents-api:
        image: serv999.com/hub/izerui/simple-agents:latest
        ports:
            - "8123:8000"
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
            browser-service:
                condition: service_started
        env_file:
            - .env
        environment:
            REDIS_URI: redis://redis:6379
            DATABASE_URI: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
            LANGSMITH_API_KEY: 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
            HF_HOME: /deps/simple-agents/data/huggingface
            HF_ENDPOINT: https://hf-mirror.com
            BROWSER_SERVICE_URL: http://browser-service:2025
            EXTRACT_API_URL: http://localhost:8000
        healthcheck:
            test: python /api/healthcheck.py
            interval: 30s
            start_period: 10s
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./data/sandbox_sessions:/deps/simple-agents/data/sandbox_sessions

    agent-chat-ui:
        image: serv999.com/hub/izerui/agent-chat-ui:latest
        ports:
            - "8124:3000"
        environment:
            LANGGRAPH_API_URL: http://agents-api:8000
            LANGSMITH_API_KEY: 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
        volumes:
          - ./data/sandbox_sessions:/home/data/sandbox_sessions

    # 独立的浏览器抓取服务
    browser-service:
        image: serv999.com/hub/izerui/browser-fetch:latest
        ports:
            - "2025:2025"
        environment:
            BROWSER_SERVICE_PORT: 2025
            BROWSER_SERVICE_HOST: 0.0.0.0
            HEADLESS: "true"
            BROWSER_POOL_SIZE: 3
            MAX_CONCURRENT_PAGES: "10"
            BROWSER_IDLE_TIMEOUT: 5
            LOG_LEVEL: "INFO"