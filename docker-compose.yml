services:
    simple-agents-redis:
        image: serv999.com/hub/redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5

    simple-agents-postgres:
        image: serv999.com/hub/pgvector/pgvector:pg16
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        command:
            - postgres
            - -c
            - shared_preload_libraries=vector
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s

    simple-agents-api:
        image: serv999.com/hub/izerui/simple-agents:latest
        ports:
            - "8123:8000"
        depends_on:
            simple-agents-redis:
                condition: service_healthy
            simple-agents-postgres:
                condition: service_healthy
        env_file:
            - .env
        environment:
            REDIS_URI: redis://simple-agents-redis:6379
            DATABASE_URI: postgres://postgres:postgres@simple-agents-postgres:5432/postgres?sslmode=disable
            LANGSMITH_API_KEY: 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
            HUGGINGFACE_HUB_CACHE: /deps/simple-agents/data/huggingface/hub
            HF_ENDPOINT: https://hf-mirror.com
        healthcheck:
            test: python /api/healthcheck.py
            interval: 30s
            start_period: 10s
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./data/sandbox_sessions:/deps/simple-agents/data/sandbox_sessions
            - ./data/huggingface:/deps/simple-agents/data/huggingface
            - /root/.cache/pip:/root/.cache/pip

    agent-chat-ui:
        image: serv999.com/hub/izerui/agent-chat-ui:latest
        ports:
            - "8124:3000"
        environment:
            LANGGRAPH_API_URL: http://simple-agents-api:8000
            LANGSMITH_API_KEY: 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
        volumes:
          - ./data/sandbox_sessions:/home/data/sandbox_sessions