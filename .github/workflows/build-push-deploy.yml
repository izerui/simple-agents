name: Build, Push and Deploy

# =============================================================================
# 触发条件
# =============================================================================
# - 推送到 main 或 master 分支时自动触发（会执行构建和部署）
# - 针对这两个分支的 Pull Request 会触发构建（但不部署）
# - 可以通过 workflow_dispatch 手动触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: izerui/simple-agents

# =============================================================================
# 工作流分为两个独立的 Job
# =============================================================================
jobs:
  # -----------------------------------------------------------------------------
  # Job 1: build-and-push
  # 负责构建 Docker 镜像并推送到 Docker Hub 中央仓库
  # -----------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 检出代码：获取仓库代码和历史记录
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. 设置 Python 环境：使用 Python 3.12
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. 安装 uv：快速的 Python 包管理器
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    # 4. 安装依赖：使用 uv 包管理器安装项目依赖
    - name: Install dependencies
      run: |
        uv sync --dev

    # 5. 安装 LangGraph CLI：用于生成 Dockerfile 的构建工具
    - name: Install LangGraph CLI
      run: |
        uv pip install langgraph-cli[all]
        # 验证安装是否成功
        uv run langgraph --version

    # 6. 生成 Dockerfile：使用 LangGraph CLI 根据 langgraph.json 生成 Dockerfile
#    - name: Generate Dockerfile
#      run: |
#        uv run langgraph dockerfile -c langgraph.json --base-image langchain/langgraph-api:3.12 ./Dockerfile
#        # 验证 Dockerfile 是否生成
#        ls -la Dockerfile

    # 7. 提取版本号：从 pyproject.toml 中读取项目版本
    - name: Extract project version
      id: project
      run: |
        VERSION=$(uv run python -c "import tomllib; config = tomllib.load(open('pyproject.toml', 'rb')); print(config['project']['version'])")
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Project version: ${VERSION}"

    # 8. 设置 Docker Buildx：启用 Docker 构建缓存和多平台支持
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 9. 登录 Docker Hub：使用配置的凭证登录到 Docker Hub 中央仓库
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
    # 10. 构建并推送镜像：构建 Docker 镜像并推送到 Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          izerui/simple-agents:latest
          izerui/simple-agents:${{ steps.project.outputs.version }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 11. 输出版本号：为 deploy job 提供版本号信息
    - name: Output version for deploy job
      run: |
        echo "version=${{ steps.project.outputs.version }}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------------
  # Job 2: deploy
  # 负责将新镜像部署到 Kubernetes 集群
  # 注意：此 job 仅在推送到主分支时执行，Pull Request 不会触发部署
  # -----------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push  # 依赖于 build-and-push job 成功完成
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    # 1. 调试信息：输出当前分支和事件类型
    - name: Debug Information
      run: |
        echo "Current branch: ${{ github.ref }}"
        echo "Event: ${{ github.event_name }}"
        
    # 2. 设置 kubectl：安装 Kubernetes 命令行工具
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      
    # 3. 配置 kubeconfig：从 Secret 中加载 Kubernetes 配置
    - name: Setup kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
    # 4. 调试 kubeconfig：验证配置文件格式是否正确
    - name: Debug kubeconfig
      run: |
        echo "Checking kubeconfig file exists:"
        ls -la $HOME/.kube/config
        echo "Checking kubeconfig format (safely):"
        grep -c "apiVersion:" $HOME/.kube/config || echo "No apiVersion found"
        grep -c "kind:" $HOME/.kube/config || echo "No kind field found"
        grep -c "cluster:" $HOME/.kube/config || echo "No cluster section found"
        
    # 5. 部署到 Kubernetes：重启指定的 deployment 以应用新镜像
    # 使用滚动更新策略，逐步重启所有 Pod
    - name: Deploy to Kubernetes
      run: |
        kubectl rollout restart deployment/simple-agents -n platform